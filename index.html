<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120e18">
  <meta name="description" content="PoleSite is a small static site host. Not open yet.">
  <link rel="icon" href="polesite-icon.svg" type="image/svg+xml">
  <title>polesite</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #120e18;
      --ink: #ece7f2;
      --muted: #9a92a6;
      --line: #2a2434;
      --accent: #b9a3e3;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .bar {
      height: 60px;
      flex: none;
      display: flex;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid var(--line);
    }

    .mark {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
    }

    .mark img {
      width: 24px;
      height: 24px;
      display: block;
      border-radius: 6px;
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 40px 24px;
    }

    .note {
      width: 100%;
      max-width: 420px;
    }

    .note h1 {
      margin: 0 0 14px;
      font-size: 22px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.4px;
    }

    .note p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 15px;
    }

    .note code {
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 13px;
      color: var(--accent);
    }

    .note a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    footer {
      flex: none;
      padding: 18px 24px 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12.5px;
    }

    @media (max-width: 480px) {
      .bar {
        height: 56px;
        padding: 0 18px;
      }

      main {
        padding: 32px 18px;
        place-items: start;
        align-content: center;
      }

      footer {
        padding: 16px 18px 20px;
      }
    }
  </style>
</head>

<body>
  <div class="bar">
    <a class="mark" href="/">
      <img src="polesite-icon.svg" alt="" width="24" height="24">
      polesite
    </a>
  </div>

  <main>
    <div class="note">
      <h1>Not open yet.</h1>
      <p>PoleSite is a small host for static sites. Upload a folder, get an address, done.</p>
      <p>We're working on the platform. Nothing to sign up for yet &mdash; check back later.</p>
    </div>
  </main>

  <footer>
    Work in progress &middot; <code>polesite.l.cd</code>
  </footer>
</body>
</html>
